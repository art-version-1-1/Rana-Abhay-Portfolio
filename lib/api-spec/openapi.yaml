openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: visits
    description: Portfolio visitor count operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /visits:
    post:
      operationId: recordVisit
      tags: [visits]
      summary: Record a portfolio visit
      description: Increments the aggregate portfolio visitor count and returns the latest total.
      responses:
        "200":
          description: Updated visitor count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitCount"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VisitCount:
      type: object
      properties:
        totalVisits:
          type: integer
          minimum: 0
      required:
        - totalVisits

